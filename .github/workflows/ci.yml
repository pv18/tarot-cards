name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Установка зависимостей
        run: yarn install --frozen-lockfile
      - name: ESLint
        run: yarn lint
      - name: Тесты
        run: yarn test:run
      - name: Сборка (tsc + vite)
        run: yarn build
