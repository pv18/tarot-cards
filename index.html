<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Таро — карта дня и расклады</title>
    <script>
      // применяем сохранённую тему до загрузки бандла, чтобы не мигала базовая
      try {
        var theme = localStorage.getItem('tarot-theme');
        if (theme && theme !== 'midnight') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Карта дня с толкованием, расклады «Три карты» и «Пять карт», все 78 арканов с прямыми и перевёрнутыми значениями."
    />
    <meta name="theme-color" content="#14101c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Таро — карта дня и расклады" />
    <meta
      property="og:description"
      content="Карта дня с толкованием, расклады «Три карты» и «Пять карт», все 78 арканов с прямыми и перевёрнутыми значениями."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
